# Calibration of ONE 4-H2S-1000 cell. Copy this file, fill in your own values
# (docs/calibration.md) and pass it with:  h2s-reader --calibration my-cell.toml
# Keys you leave out keep their default (the datasheet nominal value).

i0_ua = 0.063                  # zero current (uA) in clean air, at cal_temp_c
sensitivity_ua_per_ppm = 0.099 # (I_gas - i0) / concentration, at cal_temp_c
cal_temp_c = 20.0              # cell temperature (NTC) during the calibration

polarity = 1                   # -1 if Vout falls with H2S (docs/bring-up.md)
int_z = 0.20                   # internal zero; 0.67 together with polarity = -1

temp_compensation = true       # correct for the cell temperature
# Own temperature curves (default: datasheet averages). [temperature C, value]
# temp_sensitivity_pct = [[0, 94.0], [20, 100.0], [40, 102.0]]  # % of the 20 C signal
# temp_baseline_ppm = [[20, 0.0], [40, 1.5]]                     # ppm equivalent, 0 at 20 C

# ntc_vsupply_v = 3.30         # measured 3.3 V rail, improves the temperature reading
